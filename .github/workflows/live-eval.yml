name: live-eval-template

on:
  workflow_dispatch:
    inputs:
      execute_live:
        description: Request live preflight; still refused without an implemented verified sandbox
        required: true
        default: false
        type: boolean
      operator_confirmed:
        description: Confirm the operator-controlled environment and data authority were reviewed
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: live-evaluation
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # oven-sh/setup-bun v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Dry and fail-closed live preflight
        env:
          MEMBENCH_LIVE_REQUESTED: ${{ inputs.execute_live || 'false' }}
          MEMBENCH_OPERATOR_CONFIRMED: ${{ inputs.operator_confirmed || 'false' }}
          OPENROUTER_API_KEY: ${{ inputs.execute_live && secrets.OPENROUTER_API_KEY || '' }}
        run: bun scripts/live-preflight.ts
