name: offline-ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      # oven-sh/setup-bun v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - name: Install checksum-verified gitleaks 8.30.1
        run: |
          bash scripts/install-gitleaks.sh "$RUNNER_TEMP/bin"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit --audit-level=high
      - name: Typecheck
        run: bun run typecheck
      - name: Full offline test suite
        run: bun test --timeout 30000
      - name: Offline synthetic demo
        run: bun run demo --output "$RUNNER_TEMP/membench-demo"
      - name: Fail-closed release gate
        run: bash scripts/release-gate.sh
      - name: Gitleaks current filesystem
        run: gitleaks dir . --config=.gitleaks.toml --redact=100 --no-banner --no-color
      - name: Gitleaks reachable history
        run: gitleaks git . --config=.gitleaks.toml --redact=100 --no-banner --no-color --log-opts=--all
